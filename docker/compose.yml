services:
  postgres:
    image: postgres:17-alpine
    container_name: corsair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corsair
      POSTGRES_PASSWORD: corsair
      POSTGRES_DB: corsair
    ports:
      - "55433:5432"
    volumes:
      - corsair-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corsair"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corsair-pgdata:
