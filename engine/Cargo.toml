[package]
name = "corsair-mxfront"
version = "0.1.0"
edition = "2021"
description = "STARTTLS terminator for Corsair's SMTP listeners"
license = "MIT"

[dependencies]
# ring rather than the default aws-lc-rs: aws-lc-rs wants cmake and a C
# toolchain, which turns a static musl build into a cross-compilation project.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
