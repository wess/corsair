name: Documentation

# Builds site/content into site/public and publishes it to GitHub Pages.
#
# The generator emits links relative to the page carrying them, so the same
# output works at a domain root, under a /corsair/ project-page prefix, or off a
# local disk. Only SITE_URL — used for canonical tags and the sitemap — has to
# know where it will live.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run supersedes a pending one, but never cancels a publish in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # Before the build: it reports the base URL the site will be served from.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        id: pages

      - name: Build the site
        env:
          # `pages` swaps the control-panel link for a documentation one; there
          # is no /app behind a static host.
          SITE_MODE: pages
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: bun site/build.ts

      - name: Check every internal link resolves
        run: bun site/check.ts

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
